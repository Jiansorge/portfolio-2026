<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Friendly tan avatar">
  <rect width="200" height="200" rx="40" fill="#eaf1ff"/>
  <!-- shirt -->
  <path d="M58 200 L58 172 Q58 158 74 151 L88 140 L112 140 L126 151 Q142 158 142 170 L142 200 Z" fill="#344e5c"/>
  <!-- face -->
  <ellipse cx="100" cy="108" rx="42" ry="46" fill="#c99a6b"/>
  <!-- hair - solid, covers forehead -->
  <path d="M 52 84 Q 54 30 100 26 Q 146 30 148 84 Z" fill="#1a1208"/>
  <!-- eyebrows -->
  <path d="M 72 92 Q 82 89 92 92" stroke="#1a1208" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 108 92 Q 118 89 128 92" stroke="#1a1208" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- eyes -->
  <ellipse cx="82" cy="103" rx="7" ry="3.8" fill="#fff"/>
  <ellipse cx="82" cy="103" rx="4.7" ry="2.7" fill="#4a2d12"/>
  <circle cx="82" cy="102.7" r="1.2" fill="#0f0702"/>
  <ellipse cx="118" cy="103" rx="7" ry="3.8" fill="#fff"/>
  <ellipse cx="118" cy="103" rx="4.7" ry="2.7" fill="#4a2d12"/>
  <circle cx="118" cy="102.7" r="1.2" fill="#0f0702"/>
  <!-- mustache -->
  <path d="M 82 121 Q 91 119.5 100 121 Q 109 119.5 118 121 Q 110 123.5 100 124 Q 90 123.5 82 121 Z" fill="#1a1208"/>
  <!-- beard -->
  <path d="M 68 112 Q 70 132 80 145 Q 90 156 100 158 Q 110 156 120 145 Q 130 132 132 112 Q 130 128 120 138 Q 100 146 80 138 Q 70 128 68 112 Z" fill="#1a1208" opacity="0.88"/>
  <!-- smile -->
  <path d="M 88 131.5 Q 100 137 112 131.5" stroke="#5a1f1f" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 89 131.7 Q 100 135 111 131.7 Q 100 137 89 131.7 Z" fill="#fff" opacity="0.95"/>
</svg>
